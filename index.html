<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pool Wind Sun</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="fav.svg">
  
  <style>
    /* --- PERFECT RESET --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    
    /* --- MAIN CONTAINER --- */
    #main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 20px;
      gap: 8px;
    }
    
    /* --- TITLE (CENTER TOP) --- */
    .title-bar {
      text-align: center;
      flex-shrink: 0;
      padding: 2px 0;
      width: 100%;
    }
    .title-bar .title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
    }
    .title-bar .title .accent {
      color: #c9a84c;
      font-weight: 400;
    }
    
    /* --- CANVAS CONTAINER --- */
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 0 10px;
      position: relative;
    }
    
    #canvas-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      background: #0a0a0a;
    }
    
    #canvas-wrapper canvas {
      display: block !important;
      max-width: 100%;
      max-height: 100%;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
      border-radius: 2px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    
    /* --- SHIRT MOCKUP --- */
    #shirt-mockup {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      z-index: 2;
    }
    #shirt-mockup.active {
      display: block !important;
      animation: fadeIn 0.6s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    
    /* --- BOTTOM BAR --- */
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 6px;
      padding: 4px 0;
    }
    
    /* --- CONTROLS --- */
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    
    .controls {
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.04);
      padding: 8px 20px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      touch-action: manipulation;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .controls:hover {
      color: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
    }
    .controls:active {
      transform: scale(0.95);
    }
    .controls .key {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .controls .sep {
      color: rgba(255,255,255,0.15);
      margin: 0 4px;
    }
    
    /* --- SHIRT BUTTON --- */
    .controls.shirt-btn {
      border-color: rgba(201, 168, 76, 0.2);
      color: rgba(201, 168, 76, 0.7);
      letter-spacing: 1px;
    }
    .controls.shirt-btn:hover {
      border-color: rgba(201, 168, 76, 0.4);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.06);
    }
    .controls.shirt-btn.active {
      border-color: rgba(201, 168, 76, 0.5);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
    }
    .controls.shirt-btn .icon {
      font-size: 14px;
      line-height: 1;
    }
    
    /* --- INFO ROW --- */
    .info-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,0.3);
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      flex-wrap: wrap;
      padding: 2px 0;
    }
    .info-row .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
    }
    .info-row .label {
      color: rgba(255,255,255,0.25);
      font-weight: 300;
    }
    .info-row .value {
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }
    
    /* --- DESCRIPTION --- */
    .description {
      display: block;
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 8px;
      letter-spacing: 1.2px;
      line-height: 1.8;
      padding: 2px 10px;
      font-weight: 300;
      max-width: 500px;
      width: 100%;
      text-transform: uppercase;
    }
    .description .highlight {
      color: rgba(255,255,255,0.4);
    }
    .description .sep {
      color: rgba(255,255,255,0.08);
      margin: 0 4px;
    }
    
    /* ============================================
       RESPONSIVE
    ============================================ */
    
    @media (max-width: 1024px) {
      #main-container { padding: 16px; gap: 6px; }
      .title-bar .title { font-size: 20px; letter-spacing: 6px; }
      .controls { font-size: 10px; padding: 7px 16px; min-height: 34px; }
      .info-row { font-size: 8.5px; gap: 12px; }
      .info-row .info-item { padding: 2px 10px; }
      .description { font-size: 7.5px; letter-spacing: 1px; }
    }
    
    @media (max-width: 768px) {
      #main-container { padding: 12px; gap: 5px; }
      .title-bar .title { font-size: 17px; letter-spacing: 5px; }
      #canvas-container { padding: 0 6px; }
      .controls { font-size: 9px; padding: 6px 14px; min-height: 32px; letter-spacing: 0.6px; }
      .controls-row { gap: 6px; }
      .info-row { font-size: 8px; gap: 10px; }
      .info-row .info-item { padding: 2px 8px; }
      .description { font-size: 7px; letter-spacing: 0.8px; padding: 2px 6px; }
      .controls.shirt-btn .icon { font-size: 12px; }
    }
    
    @media (max-width: 480px) {
      #main-container { padding: 8px; gap: 4px; }
      .title-bar .title { font-size: 14px; letter-spacing: 4px; }
      #canvas-container { padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; border-radius: 24px; letter-spacing: 0.4px; }
      .controls-row { gap: 4px; }
      .info-row { font-size: 7px; gap: 8px; }
      .info-row .info-item { padding: 2px 6px; gap: 4px; }
      .description { font-size: 6.5px; letter-spacing: 0.6px; padding: 2px 4px; line-height: 1.6; }
      .controls.shirt-btn .icon { font-size: 11px; }
    }
    
    @media (max-width: 380px) {
      #main-container { padding: 6px; gap: 3px; }
      .title-bar .title { font-size: 12px; letter-spacing: 3px; }
      #canvas-container { padding: 0 2px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 26px; border-radius: 20px; }
      .info-row { font-size: 6.5px; gap: 6px; }
      .info-row .info-item { padding: 1px 5px; border-radius: 14px; }
      .description { font-size: 6px; letter-spacing: 0.5px; padding: 1px 3px; }
      .controls.shirt-btn .icon { font-size: 10px; }
    }
    
    @media (orientation: landscape) and (max-height: 500px) {
      #main-container { padding: 10px 20px; gap: 4px; flex-direction: row; flex-wrap: wrap; }
      .title-bar { width: 100%; flex-shrink: 0; }
      .title-bar .title { font-size: 16px; letter-spacing: 4px; }
      #canvas-container { flex: 1; min-height: 0; height: 100%; padding: 0 8px; }
      .bottom-bar { width: auto; max-width: 180px; flex-shrink: 0; gap: 4px; padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; letter-spacing: 0.4px; }
      .controls-row { flex-direction: column; gap: 4px; }
      .info-row { font-size: 7px; gap: 6px; flex-direction: column; align-items: stretch; }
      .info-row .info-item { padding: 2px 8px; justify-content: center; }
      .description { font-size: 6px; max-width: 160px; padding: 1px 4px; line-height: 1.4; letter-spacing: 0.5px; }
    }
    
    @media (orientation: landscape) and (max-height: 380px) {
      #main-container { padding: 6px 12px; gap: 3px; }
      .title-bar .title { font-size: 13px; letter-spacing: 3px; }
      #canvas-container { padding: 0 4px; }
      .bottom-bar { max-width: 140px; gap: 3px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 24px; border-radius: 16px; }
      .info-row { font-size: 6px; gap: 4px; }
      .info-row .info-item { padding: 1px 6px; }
      .description { font-size: 5.5px; max-width: 120px; padding: 1px 3px; }
    }
    
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      #canvas-wrapper canvas { image-rendering: auto; }
    }
    
    @supports (-webkit-touch-callout: none) {
      .controls { min-height: 40px; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .controls, #canvas-wrapper canvas, #shirt-mockup { transition: none; }
      #shirt-mockup.active { animation: none; }
    }
  </style>
</head>
<body>

<!-- MAIN CONTAINER -->
<div id="main-container">

  <!-- TITLE (CENTER TOP) -->
  <div class="title-bar">
    <div class="title"><span class="accent">Pool</span> Wind Sun</div>
  </div>

  <!-- CANVAS CONTAINER -->
  <div id="canvas-container">
    <div id="canvas-wrapper">
      <img id="shirt-mockup" src="Pool-Wind-Sun.jpg" alt="Pool Wind Sun on T-Shirt" />
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">

    <!-- CONTROLS ROW -->
    <div class="controls-row">
      <div class="controls" id="controlsBar">
        <span class="key">●</span> regenerate <span class="sep">—</span> <span class="key">S</span> save
      </div>
      <div class="controls shirt-btn" id="shirtToggle">
        <span class="icon">◷</span> apparel
      </div>
    </div>

    <!-- INFO ROW -->
    <div class="info-row">
      <div class="info-item">
        <span class="label">grid</span>
        <span class="value" id="gridDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">oscillators</span>
        <span class="value" id="oscDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">time</span>
        <span class="value" id="timeDisplay">---</span>
      </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="description">
      <span class="highlight">pool wind sun</span>
      <span class="sep">·</span>
      <span class="highlight">wave simulation</span>
      <span class="sep">·</span>
      <span class="highlight">generative art</span>
      <span class="sep">·</span>
      <span class="highlight">fluid dynamics</span>
    </div>

  </div>

</div>

<script>
// ============================================
// POOL WIND SUN — Wave Simulation Art
// ============================================

// ============================================
// Random utility (replaces fxhash)
// ============================================
let seed = Math.random() * 2147483647;

function setSeed(newSeed) {
    seed = newSeed;
}

function random() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
}

// ============================================
// Configuration
// ============================================
const ratio = 1 / 1;
const prefix = 'Pool Wind Sun';

// ============================================
// State
// ============================================
let canvas = { w: 0, h: 0 };
let matrixA, matrixL, matrixU, matrixP;
let prev, current, next;
let dt, c, maxTime;
let cols, rows;
let rectWidth, rectHeight;
let oscillatingPoints = [];
let scaleFactor, offsetX, offsetY, backgroundColor;
let resizeTmr = null;
let showingShirt = false;
let features = {};

// ============================================
// Setup
// ============================================
function setup() {
    const wrapper = document.getElementById('canvas-wrapper');
    const rect = wrapper.getBoundingClientRect();
    
    canvas.w = rect.width;
    canvas.h = rect.height;

    // Precompute all randomness
    scaleFactor = random() * 0.25 + 0.75;
    cols = Math.floor(random() * 50 + 350);
    rows = Math.floor(random() * 20 + cols - 10);
    dt = random() * 0.02 + 0.04;
    c = random() * canvas.w/80 + canvas.w/200;
    maxTime = Math.floor(random() * 40 + 30);
    rectWidth = (canvas.w * scaleFactor) / cols;
    rectHeight = (canvas.h * scaleFactor) / rows;
    offsetX = (canvas.w * (1 - scaleFactor)) / 2;
    offsetY = (canvas.h * (1 - scaleFactor)) / 2;
    backgroundColor = Math.floor(random() * 200) + 30;

    features.cols = cols;
    features.rows = rows;
    features.maxTime = maxTime;
    features.backgroundColor = backgroundColor;

    // Update info display
    document.getElementById('gridDisplay').textContent = `${cols}×${rows}`;
    document.getElementById('timeDisplay').textContent = maxTime;

    prev = new Array(cols).fill().map(() => new Array(rows).fill(0));
    current = new Array(cols).fill().map(() => new Array(rows).fill(0));
    next = new Array(cols).fill().map(() => new Array(rows).fill(0));

    matrixA = new Array(cols).fill().map(() => new Array(rows).fill(0));
    matrixL = new Array(cols).fill().map(() => new Array(rows).fill(0));
    matrixU = new Array(cols).fill().map(() => new Array(rows).fill(0));
    matrixP = new Array(cols).fill().map(() => new Array(rows).fill(0));

    let numOscillators = Math.floor(random() * 0.002 * cols * rows + 1);
    oscillatingPoints = [];
    for (let k = 0; k < numOscillators; k++) {
        let i = Math.floor(random() * cols);
        let j = Math.floor(random() * rows);
        let freq = Math.floor(random() * 50 + 10);
        oscillatingPoints.push({ i, j, freq });
    }
    
    document.getElementById('oscDisplay').textContent = numOscillators;

    simulateWave(maxTime);
    drawWave();
}

// ============================================
// Wave Simulation
// ============================================
function simulateWave(targetTime) {
    let time = 0;
    let dx2 = rectWidth * rectWidth;
    let dy2 = rectHeight * rectHeight;
    let coeff = (c * c * dt * dt);

    while (time < targetTime) {
        for (let p of oscillatingPoints) {
            let oscillationValue = Math.sin(time * p.freq * 2 * Math.PI) * 450;
            current[p.i][p.j] += oscillationValue;
        }

        for (let i = 1; i < cols - 1; i++) {
            for (let j = 1; j < rows - 1; j++) {
                next[i][j] =
                    2 * current[i][j] - prev[i][j] +
                    coeff * (
                        (current[i + 1][j] + current[i - 1][j] - 2 * current[i][j]) / dx2 +
                        (current[i][j + 1] + current[i][j - 1] - 2 * current[i][j]) / dy2
                    );
            }
        }

        for (let i = 0; i < cols; i++) {
            next[i][0] = next[i][1];
            next[i][rows - 1] = next[i][rows - 2];
        }
        for (let j = 0; j < rows; j++) {
            next[0][j] = next[1][j];
            next[cols - 1][j] = next[cols - 2][j];
        }

        let temp = prev;
        prev = current;
        current = next;
        next = temp;

        time += dt;
    }
}

// ============================================
// Gradient Color
// ============================================
function getGradientColor(i, j, normValue) {
    const xRatio = i / (cols - 1);
    const yRatio = j / (rows - 1);

    let baseR = 10 + 40 * yRatio;
    let baseG = 180 + 75 * (1 - yRatio);
    let baseB = 200 + 55 * xRatio;

    if (normValue > 0.5) {
        baseR += (255 - baseR) * 0.3;
        baseG += (255 - baseG) * 0.3;
        baseB += (255 - baseB) * 0.3;
    }

    let alpha = 100 + 155 * normValue;

    return {
        r: Math.min(255, baseR),
        g: Math.min(255, baseG),
        b: Math.min(255, baseB),
        a: Math.min(255, alpha)
    };
}

// ============================================
// Draw Wave
// ============================================
function drawWave() {
    const canvasEl = document.getElementById('target');
    if (!canvasEl) return;
    const ctx = canvasEl.getContext('2d');
    const w = canvasEl.width;
    const h = canvasEl.height;

    // Scale everything to match canvas dimensions
    const scaleX = w / canvas.w;
    const scaleY = h / canvas.h;

    ctx.fillStyle = `rgb(${backgroundColor}, ${backgroundColor}, ${backgroundColor})`;
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
            let normValue = current[i][j] / 450 * 0.5 + 0.5;
            normValue = Math.max(0, Math.min(1, normValue));
            let col = getGradientColor(i, j, normValue);

            const x = (i * rectWidth + offsetX) * scaleX;
            const y = (j * rectHeight + offsetY) * scaleY;
            const rw = (rectWidth + 0.5) * scaleX;
            const rh = (rectHeight + 0.5) * scaleY;

            ctx.fillStyle = `rgba(${col.r}, ${col.g}, ${col.b}, ${col.a / 255})`;
            ctx.fillRect(x, y, rw, rh);
        }
    }
}

// ============================================
// Layout
// ============================================
function layoutCanvas() {
    const wrapper = document.getElementById('canvas-wrapper');
    const rect = wrapper.getBoundingClientRect();
    
    const wWidth = rect.width;
    const wHeight = rect.height;
    const dpr = window.devicePixelRatio || 1;

    // Remove existing canvases
    const canvases = wrapper.getElementsByTagName('canvas');
    Array.from(canvases).forEach(c => c.remove());

    let cWidth = wWidth;
    let cHeight = cWidth / ratio;

    if (cHeight > wHeight) {
        cHeight = wHeight;
        cWidth = wHeight * ratio;
    }

    const targetWidth = Math.floor(cWidth * dpr);
    const targetHeight = Math.floor(cHeight * dpr);

    const canvasEl = document.createElement('canvas');
    canvasEl.id = 'target';
    canvasEl.width = targetWidth;
    canvasEl.height = targetHeight;
    wrapper.appendChild(canvasEl);

    canvasEl.style.position = 'absolute';
    canvasEl.style.width = cWidth + 'px';
    canvasEl.style.height = cHeight + 'px';
    canvasEl.style.top = '50%';
    canvasEl.style.left = '50%';
    canvasEl.style.transform = 'translate(-50%, -50%)';
    canvasEl.style.zIndex = '1';

    // Update canvas dimensions
    canvas.w = cWidth;
    canvas.h = cHeight;
    
    // Recalculate with new dimensions
    rectWidth = (canvas.w * scaleFactor) / cols;
    rectHeight = (canvas.h * scaleFactor) / rows;
    offsetX = (canvas.w * (1 - scaleFactor)) / 2;
    offsetY = (canvas.h * (1 - scaleFactor)) / 2;

    // Re-simulate with new dimensions
    prev = new Array(cols).fill().map(() => new Array(rows).fill(0));
    current = new Array(cols).fill().map(() => new Array(rows).fill(0));
    next = new Array(cols).fill().map(() => new Array(rows).fill(0));
    
    // Reinitialize oscillators
    let numOscillators = Math.floor(random() * 0.002 * cols * rows + 1);
    oscillatingPoints = [];
    for (let k = 0; k < numOscillators; k++) {
        let i = Math.floor(random() * cols);
        let j = Math.floor(random() * rows);
        let freq = Math.floor(random() * 50 + 10);
        oscillatingPoints.push({ i, j, freq });
    }

    simulateWave(maxTime);
    drawWave();
}

// ============================================
// Download
// ============================================
function downloadCanvas() {
    if (showingShirt) {
        const link = document.createElement('a');
        link.download = 'Pool_Wind_Sun_Shirt.png';
        const img = document.getElementById('shirt-mockup');
        if (img && img.src) {
            link.href = img.src;
        } else {
            const canvas = document.getElementById('target');
            if (canvas) link.href = canvas.toDataURL('image/png');
        }
        link.click();
        return;
    }
    
    const canvas = document.getElementById('target');
    if (!canvas) return;
    const link = document.createElement('a');
    const hash = Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
    link.download = prefix + '_' + hash + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

// ============================================
// Regenerate
// ============================================
function regenerate() {
    setSeed(Math.random() * 2147483647);
    const wrapper = document.getElementById('canvas-wrapper');
    const canvas = wrapper.querySelector('canvas');
    if (canvas) {
        canvas.remove();
    }
    const shirtMockup = document.getElementById('shirt-mockup');
    shirtMockup.classList.remove('active');
    showingShirt = false;
    const shirtToggle = document.getElementById('shirtToggle');
    shirtToggle.classList.remove('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
    setup();
    layoutCanvas();
}

// ============================================
// Toggle Shirt
// ============================================
function toggleShirt() {
    showingShirt = !showingShirt;
    
    const canvas = document.getElementById('target');
    const shirtMockup = document.getElementById('shirt-mockup');
    const shirtToggle = document.getElementById('shirtToggle');
    
    if (showingShirt) {
        if (canvas) {
            canvas.style.display = 'block';
            canvas.style.zIndex = '1';
        }
        shirtMockup.classList.add('active');
        shirtMockup.style.zIndex = '2';
        shirtToggle.classList.add('active');
        shirtToggle.innerHTML = '<span class="icon">◷</span> artwork';
    } else {
        if (canvas) {
            canvas.style.display = 'block';
            canvas.style.zIndex = '1';
        }
        shirtMockup.classList.remove('active');
        shirtToggle.classList.remove('active');
        shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
    }
}

// ============================================
// Init
// ============================================
function init() {
    setup();
    layoutCanvas();

    // Resize handler
    window.addEventListener('resize', () => {
        clearTimeout(resizeTmr);
        resizeTmr = setTimeout(layoutCanvas, 100);
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 's' || e.key === 'S') {
            e.preventDefault();
            downloadCanvas();
        }
        if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            regenerate();
        }
        if (e.key === 't' || e.key === 'T') {
            e.preventDefault();
            toggleShirt();
        }
        if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            regenerate();
        }
    });

    // Button handlers
    document.getElementById('controlsBar').addEventListener('click', regenerate);
    document.getElementById('controlsBar').addEventListener('touchend', function(e) {
        e.preventDefault();
        regenerate();
    });
    
    document.getElementById('shirtToggle').addEventListener('click', toggleShirt);
    document.getElementById('shirtToggle').addEventListener('touchend', function(e) {
        e.preventDefault();
        toggleShirt();
    });
}

// Start
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

// Expose functions globally
window.regenerate = regenerate;
window.saveImage = downloadCanvas;
window.toggleShirt = toggleShirt;
</script>
</body>
